<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=
    0, initial-scale=1.0"
    />
    <title>Your Coctail</title>

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
    />
    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <main class="page-wrapper">
      <section class="search-area">
        <form id="searchForm" class="d-flex gap-3">
          <input
            id="searchInput"
            type="text"
            class="form-control search-input"
            placeholder="Search by name or first letter"
            autocomplete="off"
          />

          <button type="submit" class="btn search-btn">Search</button>
        </form>
      </section>

      <div class="row g-4">
        <section class="col-lg-8">
          <div id="cocktailContainer" class="row g-4">
            <div class="col-12">
              <div class="loading-box">
                <div class="spinner-border text-secondary" role="status"></div>

                <p class="mt-3 mb-0">Loading cocktails...</p>
              </div>
            </div>
          </div>
        </section>

        <aside class="col-lg-4">
          <div class="cart-card">
            <div class="p-3 border-bottom">
              <div class="d-flex align-items-center gap-2">
                <span class="cart-title">Total Cart:</span>

                <span id="cartCount" class="cart-count">0</span>
              </div>

              <small id="cartLimitText" class="text-muted"
                >Maximum 7 cocktails</small
              >
            </div>

            <div class="table-responsive">
              <table class="table table-hover cart-table">
                <thead>
                  <tr>
                    <th>SL</th>
                    <th>Img</th>
                    <th>Name</th>
                    <th></th>
                  </tr>
                </thead>

                <tbody id="cartBody">
                  <tr>
                    <td colspan="4" class="empty-cart">
                      No cocktail selected.
                    </td>
                  </tr>
                </tbody>
              </table>
            </div>
          </div>
        </aside>
      </div>
    </main>

    <div
      class="modal fade"
      id="detailsModal"
      tabindex="-1"
      aria-labelledby="detailsModalLabel"
      aria-hidden="true"
    >
      <div
        class="modal-dialog modal-lg modal-dialog-centered modal-dialog-scrollable"
      >
        <div class="modal-content">
          <div class="modal-header">
            <h5 id="detailsModalLabel" class="modal-title">Cocktail Details</h5>

            <button
              type="button"
              class="btn-close"
              data-bs-dismiss="modal"
              aria-label="Close"
            ></button>
          </div>

          <div id="modalBody" class="modal-body"></div>
        </div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="./script.js"></script>
  </body>
</html>
